<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A84B"/>
      <stop offset="100%" stop-color="#F5D76E"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="8"/>

  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#60A5FA" stroke-width="0.5">
    <line x1="0" y1="100" x2="512" y2="100"/>
    <line x1="0" y1="200" x2="512" y2="200"/>
    <line x1="0" y1="300" x2="512" y2="300"/>
    <line x1="0" y1="400" x2="512" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="512"/>
    <line x1="200" y1="0" x2="200" y2="512"/>
    <line x1="300" y1="0" x2="300" y2="512"/>
    <line x1="400" y1="0" x2="400" y2="512"/>
  </g>

  <!-- Robot/AI head icon -->
  <g transform="translate(256, 170)">
    <!-- Head shape -->
    <rect x="-48" y="-48" width="96" height="80" rx="16" fill="none" stroke="url(#gold)" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Eyes -->
    <circle cx="-16" cy="-18" r="6" fill="url(#blueGlow)" filter="url(#glow)"/>
    <circle cx="16" cy="-18" r="6" fill="url(#blueGlow)" filter="url(#glow)"/>
    <!-- Mouth line -->
    <line x1="-20" y1="6" x2="20" y2="6" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <!-- Antenna -->
    <line x1="0" y1="-48" x2="0" y2="-62" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="0" cy="-66" r="5" fill="#F5D76E" filter="url(#glow)"/>
  </g>

  <!-- Agent nodes connected by lines (neural net style) -->
  <g opacity="0.5" stroke="#60A5FA" stroke-width="1" stroke-dasharray="4,3">
    <line x1="160" y1="200" x2="200" y2="250"/>
    <line x1="352" y1="200" x2="312" y2="250"/>
    <line x1="200" y1="250" x2="256" y2="280"/>
    <line x1="312" y1="250" x2="256" y2="280"/>
    <line x1="160" y1="200" x2="256" y2="170"/>
    <line x1="352" y1="200" x2="256" y2="170"/>
  </g>

  <!-- Small node dots -->
  <circle cx="160" cy="200" r="4" fill="#60A5FA" opacity="0.6"/>
  <circle cx="352" cy="200" r="4" fill="#60A5FA" opacity="0.6"/>
  <circle cx="200" cy="250" r="3" fill="#93C5FD" opacity="0.5"/>
  <circle cx="312" cy="250" r="3" fill="#93C5FD" opacity="0.5"/>
  <circle cx="256" cy="280" r="3" fill="#93C5FD" opacity="0.5"/>

  <!-- Feature cards -->
  <g transform="translate(60, 310)">
    <rect width="88" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="44" y="24" text-anchor="middle" font-family="system-ui" font-size="10" fill="#D4A84B" font-weight="bold">Email</text>
    <text x="44" y="40" text-anchor="middle" font-family="system-ui" font-size="8" fill="#94A3B8">自動分類回覆</text>
  </g>

  <g transform="translate(162, 310)">
    <rect width="88" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="44" y="24" text-anchor="middle" font-family="system-ui" font-size="10" fill="#D4A84B" font-weight="bold">數據</text>
    <text x="44" y="40" text-anchor="middle" font-family="system-ui" font-size="8" fill="#94A3B8">分析報告生成</text>
  </g>

  <g transform="translate(264, 310)">
    <rect width="88" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="44" y="24" text-anchor="middle" font-family="system-ui" font-size="10" fill="#D4A84B" font-weight="bold">文書</text>
    <text x="44" y="40" text-anchor="middle" font-family="system-ui" font-size="8" fill="#94A3B8">自動草稿撰寫</text>
  </g>

  <g transform="translate(366, 310)">
    <rect width="88" height="60" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="44" y="24" text-anchor="middle" font-family="system-ui" font-size="10" fill="#D4A84B" font-weight="bold">排程</text>
    <text x="44" y="40" text-anchor="middle" font-family="system-ui" font-size="8" fill="#94A3B8">定時任務自動化</text>
  </g>

  <!-- Title area -->
  <g transform="translate(256, 430)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui" font-size="18" fill="#F5D76E" font-weight="bold" filter="url(#shadow)">AI Agent</text>
    <text x="0" y="26" text-anchor="middle" font-family="system-ui" font-size="12" fill="#CBD5E1" opacity="0.9">2026 實戰入門指南</text>
  </g>

  <!-- Decorative bottom line -->
  <line x1="156" y1="470" x2="356" y2="470" stroke="url(#gold)" stroke-width="1.5" opacity="0.4"/>
</svg>
