<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d4a7a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c84c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:0.7" />
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#95a5a6;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#7f8c8d;stop-opacity:0.6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="0"/>

  <!-- Subtle circular pattern -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.05"/>

  <!-- HK skyline silhouette -->
  <g fill="#0f1a30" opacity="0.25">
    <rect x="30" y="310" width="30" height="150"/>
    <rect x="55" y="340" width="20" height="120"/>
    <rect x="75" y="280" width="28" height="180"/>
    <rect x="100" y="320" width="18" height="140"/>
    <rect x="118" y="260" width="35" height="200"/>
    <rect x="155" y="300" width="22" height="160"/>
    <rect x="178" y="330" width="20" height="130"/>
    <rect x="200" y="250" width="30" height="210"/>
    <rect x="232" y="290" width="22" height="170"/>
    <rect x="256" y="270" width="28" height="190"/>
    <rect x="286" y="310" width="20" height="150"/>
    <rect x="308" y="260" width="30" height="200"/>
    <rect x="340" y="300" width="22" height="160"/>
    <rect x="364" y="240" width="32" height="220"/>
    <rect x="398" y="280" width="24" height="180"/>
    <rect x="424" y="310" width="22" height="150"/>
    <rect x="448" y="270" width="30" height="190"/>
  </g>

  <!-- Upward trending arrow / chart -->
  <g transform="translate(256, 200)" opacity="0.15">
    <polyline points="-130,40 -80,30 -40,45 0,10 40,25 80,-10 120,5 140,-20" fill="none" stroke="#4caf50" stroke-width="4" stroke-linecap="round"/>
    <circle cx="140" cy="-20" r="6" fill="#4caf50"/>
  </g>

  <!-- Bond certificate icon -->
  <g transform="translate(256, 148)" filter="url(#softGlow)">
    <!-- Certificate document -->
    <rect x="-60" y="-45" width="120" height="90" rx="6" fill="#f5f0e0" stroke="#c9a84c" stroke-width="2" opacity="0.9"/>
    <!-- Certificate ribbon top -->
    <rect x="-60" y="-45" width="120" height="12" rx="3" fill="url(#gold)" opacity="0.9"/>
    <!-- Seal -->
    <circle cx="30" cy="10" r="14" fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.7"/>
    <circle cx="30" cy="10" r="10" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.5"/>
    <text x="30" y="14" font-family="serif" font-size="10" fill="#c9a84c" text-anchor="middle" font-weight="bold">BOND</text>
    <!-- Text lines on cert -->
    <rect x="-45" y="-25" width="70" height="3" rx="1.5" fill="#333" opacity="0.3"/>
    <rect x="-45" y="-15" width="55" height="3" rx="1.5" fill="#333" opacity="0.2"/>
    <rect x="-45" y="-5" width="60" height="3" rx="1.5" fill="#333" opacity="0.2"/>
    <!-- Gold corner decorations -->
    <circle cx="-50" cy="-35" r="3" fill="#c9a84c" opacity="0.6"/>
    <circle cx="50" cy="-35" r="3" fill="#c9a84c" opacity="0.6"/>
    <circle cx="-50" cy="35" r="3" fill="#c9a84c" opacity="0.6"/>
    <circle cx="50" cy="35" r="3" fill="#c9a84c" opacity="0.6"/>
  </g>

  <!-- Small badges: iBond, Green, Silver -->
  <g transform="translate(256, 230)">
    <rect x="-100" y="-14" width="55" height="22" rx="11" fill="url(#gold)" opacity="0.8"/>
    <text x="-72" y="2" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="11" fill="#1a2a4a" text-anchor="middle" font-weight="bold">iBond</text>

    <rect x="-35" y="-14" width="70" height="22" rx="11" fill="url(#green)" opacity="0.8"/>
    <text x="0" y="2" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">綠色債券</text>

    <rect x="45" y="-14" width="60" height="22" rx="11" fill="url(#silver)" opacity="0.8"/>
    <text x="75" y="2" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">銀色債券</text>
  </g>

  <!-- Main title -->
  <g transform="translate(256, 300)" text-anchor="middle">
    <text x="0" y="0" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">香港零售債券</text>
    <text x="0" y="32" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="bold" fill="url(#gold)" text-anchor="middle">低風險收息實戰攻略</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(256, 355)" text-anchor="middle">
    <text x="0" y="0" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="15" fill="#b0c4de" text-anchor="middle">由 iBond 到綠色債券 · 2026 最新部署</text>
  </g>

  <!-- Decorative coins -->
  <g opacity="0.3">
    <circle cx="80" cy="420" r="12" fill="#c9a84c" stroke="#e8c84c" stroke-width="1.5"/>
    <text x="80" y="425" font-family="sans-serif" font-size="12" fill="#1a2a4a" text-anchor="middle" font-weight="bold">$</text>
    <circle cx="120" cy="440" r="10" fill="#c9a84c" stroke="#e8c84c" stroke-width="1.5" opacity="0.6"/>
    <circle cx="380" cy="430" r="11" fill="#c9a84c" stroke="#e8c84c" stroke-width="1.5" opacity="0.4"/>
    <text x="380" y="435" font-family="sans-serif" font-size="11" fill="#1a2a4a" text-anchor="middle" font-weight="bold">$</text>
    <circle cx="430" cy="410" r="9" fill="#c9a84c" stroke="#e8c84c" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Stars -->
  <circle cx="50" cy="60" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="450" cy="50" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="420" cy="120" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="100" cy="70" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="390" cy="160" r="1" fill="#ffffff" opacity="0.3"/>
  <circle cx="150" cy="130" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="40" cy="180" r="1.5" fill="#ffffff" opacity="0.3"/>
  <circle cx="470" cy="200" r="1" fill="#ffffff" opacity="0.4"/>

  <!-- Bottom tag -->
  <g transform="translate(256, 490)" text-anchor="middle">
    <text x="0" y="0" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="12" fill="#5a7a9a" text-anchor="middle">Sun ny's Blog · 2026</text>
  </g>
</svg>
