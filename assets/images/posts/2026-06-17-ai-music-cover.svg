<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a2e"/>
      <stop offset="50%" style="stop-color:#1a1a4e"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6bcb;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6bcb"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#ff6bcb;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>

  <!-- Grid lines -->
  <g opacity="0.05" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
  </g>

  <!-- Sound wave visualization - left side -->
  <g transform="translate(60, 100)" filter="url(#softGlow)">
    <!-- Waveform bars -->
    <rect x="0" y="40" width="8" height="80" rx="4" fill="url(#barGrad1)" opacity="0.9">
      <animate attributeName="height" values="80;120;80" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="40;20;40" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="16" y="20" width="8" height="120" rx="4" fill="url(#barGrad1)" opacity="0.85">
      <animate attributeName="height" values="120;60;120" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="20;50;20" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="32" y="50" width="8" height="60" rx="4" fill="url(#barGrad2)" opacity="0.8">
      <animate attributeName="height" values="60;140;60" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="50;10;50" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="10" width="8" height="140" rx="4" fill="url(#barGrad2)" opacity="0.85">
      <animate attributeName="height" values="140;80;140" dur="1.0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="10;40;10" dur="1.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="64" y="30" width="8" height="100" rx="4" fill="url(#barGrad3)" opacity="0.8">
      <animate attributeName="height" values="100;50;100" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;55;30" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="45" width="8" height="70" rx="4" fill="url(#barGrad3)" opacity="0.75">
      <animate attributeName="height" values="70;130;70" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="45;15;45" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="96" y="25" width="8" height="110" rx="4" fill="url(#barGrad1)" opacity="0.7">
      <animate attributeName="height" values="110;70;110" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="25;45;25" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="112" y="15" width="8" height="130" rx="4" fill="url(#barGrad2)" opacity="0.75">
      <animate attributeName="height" values="130;90;130" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="15;35;15" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="128" y="35" width="8" height="90" rx="4" fill="url(#barGrad3)" opacity="0.7">
      <animate attributeName="height" values="90;150;90" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="35;5;35" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="144" y="10" width="8" height="140" rx="4" fill="url(#barGrad1)" opacity="0.65">
      <animate attributeName="height" values="140;60;140" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="10;50;10" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="160" y="40" width="8" height="80" rx="4" fill="url(#barGrad2)" opacity="0.6">
      <animate attributeName="height" values="80;110;80" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="40;25;40" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="176" y="20" width="8" height="120" rx="4" fill="url(#barGrad3)" opacity="0.65">
      <animate attributeName="height" values="120;100;120" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="20;30;20" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Central glow circle -->
  <circle cx="400" cy="200" r="120" fill="url(#glowGrad)" filter="url(#softGlow)" opacity="0.4"/>

  <!-- Music note: eighth note -->
  <g transform="translate(370, 120)" filter="url(#neonGlow)">
    <ellipse cx="0" cy="100" rx="20" ry="15" fill="none" stroke="#ff6bcb" stroke-width="3"/>
    <line x1="18" y1="95" x2="18" y2="0" stroke="#ff6bcb" stroke-width="3"/>
    <path d="M 18 0 Q 40 10 50 30" fill="none" stroke="#ff6bcb" stroke-width="3"/>
    <path d="M 50 30 Q 55 40 48 45" fill="none" stroke="#ff6bcb" stroke-width="3" opacity="0.7"/>
  </g>

  <!-- Music note: quarter note -->
  <g transform="translate(460, 160)" filter="url(#neonGlow)">
    <ellipse cx="0" cy="80" rx="16" ry="12" fill="none" stroke="#06b6d4" stroke-width="3"/>
    <line x1="14" y1="76" x2="14" y2="0" stroke="#06b6d4" stroke-width="3"/>
  </g>

  <!-- Music note: sixteenth note -->
  <g transform="translate(310, 210)" filter="url(#neonGlow)">
    <ellipse cx="0" cy="70" rx="14" ry="10" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
    <line x1="12" y1="66" x2="12" y2="0" stroke="#8b5cf6" stroke-width="2.5"/>
    <path d="M 12 0 Q 28 8 35 20" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
    <path d="M 12 20 Q 28 28 35 40" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
  </g>

  <!-- Small floating dots -->
  <circle cx="250" cy="80" r="2" fill="#ff6bcb" opacity="0.6">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;70;80" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="300" r="2" fill="#06b6d4" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;290;300" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="320" r="1.5" fill="#8b5cf6" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="100" r="1.5" fill="#10b981" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="180" r="1" fill="#ff6bcb" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="250" r="1" fill="#06b6d4" opacity="0.5">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Text section -->
  <!-- Category badge -->
  <rect x="520" y="30" width="90" height="28" rx="14" fill="rgba(139,92,246,0.2)" stroke="#8b5cf6" stroke-width="1"/>
  <text x="565" y="49" font-family="Arial, sans-serif" font-size="12" fill="#8b5cf6" text-anchor="middle" font-weight="bold">AI 創作</text>

  <!-- Main title -->
  <text x="440" y="110" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="middle">
    AI 音樂生成創作
  </text>
  <text x="440" y="145" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="middle">
    實戰指南
  </text>

  <!-- Subtitle -->
  <text x="440" y="185" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#a5b4fc" text-anchor="middle" opacity="0.9">
    用 Suno、Udio 同 AI 由零製作你嘅第一首歌
  </text>

  <!-- Divider line -->
  <line x1="370" y1="210" x2="510" y2="210" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>

  <!-- Features list -->
  <g transform="translate(440, 240)" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" font-size="12" fill="#c4b5fd">
    <circle cx="-70" cy="-8" r="3" fill="#06b6d4"/>
    <text x="-60" y="-5">🎵 Suno V4 完整教學</text>
    <circle cx="-70" cy="14" r="3" fill="#06b6d4"/>
    <text x="-60" y="17">🎸 寫 Prompt 技巧 + 範例</text>
    <circle cx="-70" cy="36" r="3" fill="#06b6d4"/>
    <text x="-60" y="39">📋 商用版權 FAQ</text>
  </g>

  <!-- Bottom gradient bar -->
  <rect x="0" y="385" width="800" height="15" fill="url(#waveGrad)"/>

  <!-- Small decorative waveform at bottom -->
  <path d="M 0 395 Q 50 380 100 395 T 200 395 T 300 395 T 400 395 T 500 395 T 600 395 T 700 395 T 800 395" fill="none" stroke="#ff6bcb" stroke-width="1" opacity="0.3">
    <animate attributeName="d" values="M 0 395 Q 50 380 100 395 T 200 395 T 300 395 T 400 395 T 500 395 T 600 395 T 700 395 T 800 395;M 0 395 Q 50 410 100 395 T 200 395 T 300 395 T 400 395 T 500 395 T 600 395 T 700 395 T 800 395;M 0 395 Q 50 380 100 395 T 200 395 T 300 395 T 400 395 T 500 395 T 600 395 T 700 395 T 800 395" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
